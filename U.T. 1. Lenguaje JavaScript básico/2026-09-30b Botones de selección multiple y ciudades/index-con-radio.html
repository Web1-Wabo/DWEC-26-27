<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="module">
        import { ciudades } from './ciudades.js';

        const nForm = document.getElementById('eFrmCiudades');

        for (const ciudad of ciudades) {
            const nCheckbox = document.createElement('input');
            nForm.appendChild(nCheckbox);
            nCheckbox.setAttribute('type', 'radio');
            nCheckbox.setAttribute('name', 'ciudad');
            nCheckbox.setAttribute('id', `eChk${ciudad.codigoPostal}`);
            nCheckbox.setAttribute('value', ciudad.codigoPostal);
            if (ciudad.codigoPostal === '30800') {
                nCheckbox.setAttribute('checked', '');
            }
    
            const nLabel = document.createElement('label');
            nForm.appendChild(nLabel);
            nLabel.setAttribute('for', `eChk${ciudad.codigoPostal}`);
    
            const nText = document.createTextNode(ciudad.nombre);
            nLabel.appendChild(nText);

            const nBr = document.createElement('br');
            nForm.appendChild(nBr);
        }


    </script>

</head>
<body>
    <h1>Ciudades de Murcia</h1>

    <form id="eFrmCiudades" action="https://www.dsfaasdfasfasf.com/ciudades.php" method="get">

</body>
</html>
