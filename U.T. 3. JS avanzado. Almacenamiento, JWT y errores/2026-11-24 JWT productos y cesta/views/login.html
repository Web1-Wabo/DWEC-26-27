<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            min-height: 100dvh;
            display: grid;
            place-content: center;
        }

        form {
            display: inline-grid;
            gap: 1rem;
        }

        input:not(:invalid)+div {
            display: none;
        }
        
        input:invalid+div {
            display: block;
            color: red;
        }

    </style>
</head>
<body>
    <header>
        <div>Mercadillo Arcas</div>
    </header>

    <form action="">
        <label for="">Email:</label>
        <input type="text" required pattern=".+@iesramonarcas\.es">
        <div>Fíjese e introduzca correctamente lo que se le pide.</div>

        <label for="">Contraseña:</label>
        <input type="password" name="" id="" required>
        <div>Fíjese e introduzca correctamente lo que se le pide.</div>

        <button type="submit">Login</button>
    </form>
</body>
</html>
